          "@type": "WebSite",

          "name": "Reelmotion AI",

        {
          "@type": "WebPage",
          "@id": "https://reelmotion.ai/#webpage",
          "url": "https://reelmotion.ai",
          "name": "Reelmotion AI — Campaign-Ready AI Video, Images & Voice at Scale",
          "isPartOf": { "@id": "https://reelmotion.ai/#website" },
          "about": { "@id": "https://reelmotion.ai/#organization" },

        {
          "@type": "SoftwareApplication",
          "name": "Reelmotion AI",
          "description": "AI content platform for marketing teams and agencies: turn a campaign brief into studio-quality video, images and voiceovers in minutes, with 15+ AI models, a cloud video editor, shared project folders, and a remote MCP server + REST API to connect Claude, ChatGPT or any AI agent.",
          "featureList": [
            "AI video generation (Kling V3, Seedance 2.5, Veo 3.1, Runway Gen-4.5)",
            "AI image generation (Nano Banana 2, GPT Image 2, Seedream 5.0, Midjourney V8.1)",
            "AI voiceover with ElevenLabs multi-language TTS",
            "ReelBot guided prompt builder",
            "Cloud video editor with multi-track timeline",
            "Shared project folders and media library",
            "Remote MCP server for Claude, ChatGPT, Claude Code and Cursor",
            "REST API with OAuth 2.1 and API keys"
          ],
          "url": "https://reelmotion.ai",
          "applicationCategory": "MultimediaApplication",
          "operatingSystem": "Web",
          "offers": [
            {
              "@type": "Offer",
              "name": "Free",

              "price": "47.99",
              "priceCurrency": "USD",
              "billingIncrement": "P1M"
            }

          "@type": "BreadcrumbList",
          "itemListElement": [
            { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://reelmotion.ai/" },
            { "@type": "ListItem", "position": 2, "name": "Developers", "item": "https://reelmotion.ai/developers" },
            { "@type": "ListItem", "position": 3, "name": "Contact", "item": "https://reelmotion.ai/contact" },
            { "@type": "ListItem", "position": 4, "name": "Terms of Service", "item": "https://reelmotion.ai/terms" },
            { "@type": "ListItem", "position": 5, "name": "Privacy Policy", "item": "https://reelmotion.ai/privacy" }
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "What is Reelmotion AI?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Reelmotion AI is an AI content platform for marketing teams and agencies. You brief a campaign in plain language and Reelmotion generates studio-quality video, images and voiceovers using 15+ AI models, including Kling V3, Seedance 2.5, Veo 3.1, Runway Gen-4.5, Nano Banana 2, GPT Image 2, Seedream 5.0 and ElevenLabs TTS. ReelBot, its AI agent, writes the production-grade prompt for you, so no prompt engineering is required, and one brief can produce 10+ variations for A/B testing."
              }
            },
            {
              "@type": "Question",
              "name": "How does Reelmotion AI work?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Reelmotion works in five steps: 1) brief your campaign idea in your own words, 2) ReelBot crafts a production-grade prompt, 3) pick the AI model, resolution, aspect ratio and duration, 4) see the exact token cost before you generate, 5) generate and download the asset or send it straight to the built-in cloud video editor for final polish."
              }
            },
            {
              "@type": "Question",
              "name": "How much does Reelmotion AI cost?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Reelmotion offers three plans: Free ($0 with 20 tokens for basic image generation), Pro ($17.99/month with 1,000 tokens and access to all models including video generation), and Elite ($47.99/month with 4,000 tokens, highest rendering priority, early model access and a commercial license). Annual billing saves 10%. One token equals US$0.01. Agencies and brands producing hundreds of assets a month can request custom token volume at https://reelmotion.ai/contact."
              }
            },
            {
              "@type": "Question",
              "name": "What AI models does Reelmotion support?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Reelmotion integrates 15+ AI models on one platform: Kling V3, Kling O3, Kling O1, Seedance 2.5, Veo 3.1 and Runway Gen-4.5 for video; Nano Banana 2, GPT Image 2, Seedream 5.0 and Midjourney V8.1 for images; and ElevenLabs multi-language TTS for voiceovers. New models are added as they launch."
              }
            },
            {
              "@type": "Question",
              "name": "Can I use Reelmotion AI for free?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. The Free plan includes 20 tokens, access to basic AI image generation models and a limited version of the video editor and AI agent. No credit card is required to get started."
              }
            },
            {
              "@type": "Question",
              "name": "Does Reelmotion integrate with Claude or ChatGPT?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Reelmotion exposes a remote MCP (Model Context Protocol) server at https://backend.reelmotion.ai/mcp secured with OAuth 2.1 + PKCE and dynamic client registration. Any MCP client can generate media on behalf of the connected user with the tools create_image, create_video, create_audio, list_models, list_voices and wait_for_task. It works with Claude.ai and Claude Desktop (Settings → Connectors → Add custom connector), Claude Code (claude mcp add --transport http reelmotion https://backend.reelmotion.ai/mcp), ChatGPT (Settings → Connectors → Developer mode) and Cursor. Setup guides are at https://reelmotion.ai/developers."
              }
            },
            {
              "@type": "Question",
              "name": "Does Reelmotion have an API?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. The Reelmotion REST API at https://backend.reelmotion.ai/api/v1 offers POST /v1/images, /v1/videos and /v1/audio (asynchronous tasks polled via GET /v1/tasks/{id}), plus /v1/me, /v1/models, /v1/voices and /v1/billing/checkout-url. Authenticate with an API key (rm_ prefix, created under Profile → API & Integrations) or OAuth 2.1. Rate limit is 60 requests per minute with up to 5 in-flight generations. Full documentation: https://reelmotion.ai/developers."
              }
            },
            {
              "@type": "Question",
              "name": "Can teams work together in Reelmotion?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Yes. Teams can share project folders with other users so everyone works from the same campaign assets, every image, video and voiceover generated in a shared folder is available to all its members in the library and the cloud editor, and teams can plug Reelmotion into their own agents and pipelines through the MCP server or REST API."
              }
            },
            {
              "@type": "Question",
              "name": "Is there an enterprise plan for agencies?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Agencies and brands running campaigns at scale can request custom token volume and API/MCP integration support by contacting the Reelmotion team at https://reelmotion.ai/contact."
              }
            }
          ]
        }
      ]
    }
